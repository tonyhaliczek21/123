<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot</title>
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="app-title">Pilot</h1>
            <div class="connection-status" id="connectionStatus">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <span>Łączenie...</span>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-button active" data-tab="pilot">
                <i class="fa-solid fa-gamepad"></i>
                Pilot
            </button>
            <button class="tab-button" data-tab="settings">
                <i class="fa-solid fa-gear"></i>
                Ustawienia
            </button>
        </nav>

        <main class="main-content">
            <!-- Pilot Tab -->
            <div id="pilot-tab" class="tab-content active">
                <div class="remotes-container">
                    <!-- Ceiling Light Remote -->
                    <div class="remote-panel">
                        <h3 class="remote-title">
                            <i class="fa-solid fa-lightbulb"></i>
                            Oświetlenie Sufitowe
                        </h3>
                        <div class="remote-buttons">
                            <div class="button-row">
                                <button class="remote-btn" data-button="ceiling_power">
                                    <i class="fa-solid fa-power-off"></i>
                                    <span>Power</span>
                                </button>
                                <button class="remote-btn" data-button="ceiling_bright_up">
                                    <i class="fa-solid fa-sun"></i>
                                    <span>Bright+</span>
                                </button>
                                <button class="remote-btn" data-button="ceiling_bright_down">
                                    <i class="fa-solid fa-moon"></i>
                                    <span>Bright-</span>
                                </button>
                            </div>
                            <div class="button-row">
                                <button class="remote-btn" data-button="ceiling_red">
                                    <i class="fa-solid fa-circle" style="color: #ff4444;"></i>
                                    <span>Red</span>
                                </button>
                                <button class="remote-btn" data-button="ceiling_green">
                                    <i class="fa-solid fa-circle" style="color: #44ff44;"></i>
                                    <span>Green</span>
                                </button>
                                <button class="remote-btn" data-button="ceiling_blue">
                                    <i class="fa-solid fa-circle" style="color: #4444ff;"></i>
                                    <span>Blue</span>
                                </button>
                            </div>
                            <div class="button-row">
                                <button class="remote-btn" data-button="ceiling_white">
                                    <i class="fa-solid fa-circle" style="color: #ffffff;"></i>
                                    <span>White</span>
                                </button>
                                <button class="remote-btn" data-button="ceiling_mode">
                                    <i class="fa-solid fa-palette"></i>
                                    <span>Mode</span>
                                </button>
                                <button class="remote-btn" data-button="ceiling_speed">
                                    <i class="fa-solid fa-forward"></i>
                                    <span>Speed</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- LED TV Remote -->
                    <div class="remote-panel">
                        <h3 class="remote-title">
                            <i class="fa-solid fa-tv"></i>
                            Oświetlenie LED TV
                        </h3>
                        <div class="remote-buttons">
                            <div class="button-row">
                                <button class="remote-btn" data-button="tv_power">
                                    <i class="fa-solid fa-power-off"></i>
                                    <span>Power</span>
                                </button>
                                <button class="remote-btn" data-button="tv_bright_up">
                                    <i class="fa-solid fa-sun"></i>
                                    <span>Bright+</span>
                                </button>
                                <button class="remote-btn" data-button="tv_bright_down">
                                    <i class="fa-solid fa-moon"></i>
                                    <span>Bright-</span>
                                </button>
                            </div>
                            <div class="button-row">
                                <button class="remote-btn" data-button="tv_red">
                                    <i class="fa-solid fa-circle" style="color: #ff4444;"></i>
                                    <span>Red</span>
                                </button>
                                <button class="remote-btn" data-button="tv_green">
                                    <i class="fa-solid fa-circle" style="color: #44ff44;"></i>
                                    <span>Green</span>
                                </button>
                                <button class="remote-btn" data-button="tv_blue">
                                    <i class="fa-solid fa-circle" style="color: #4444ff;"></i>
                                    <span>Blue</span>
                                </button>
                            </div>
                            <div class="button-row">
                                <button class="remote-btn" data-button="tv_white">
                                    <i class="fa-solid fa-circle" style="color: #ffffff;"></i>
                                    <span>White</span>
                                </button>
                                <button class="remote-btn" data-button="tv_mode">
                                    <i class="fa-solid fa-palette"></i>
                                    <span>Mode</span>
                                </button>
                                <button class="remote-btn" data-button="tv_speed">
                                    <i class="fa-solid fa-forward"></i>
                                    <span>Speed</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings Tab -->
            <div id="settings-tab" class="tab-content">
                <div class="settings-section">
                    <h3 class="settings-title">
                        <i class="fa-solid fa-graduation-cap"></i>
                        Tryb Nauki
                    </h3>
                    <p class="settings-description">
                        Kliknij przycisk poniżej, a następnie naciśnij przycisk na fizycznym pilocie, który chcesz nauczyć.
                    </p>
                    
                    <!-- Learning mode remotes (same as pilot tab but for learning) -->
                    <div class="remotes-container">
                        <!-- Ceiling Light Learning Remote -->
                        <div class="remote-panel learning-panel">
                            <h4 class="remote-title">
                                <i class="fa-solid fa-lightbulb"></i>
                                Oświetlenie Sufitowe
                            </h4>
                            <div class="remote-buttons">
                                <div class="button-row">
                                    <button class="remote-btn learning-btn" data-button="ceiling_power">
                                        <i class="fa-solid fa-power-off"></i>
                                        <span>Power</span>
                                    </button>
                                    <button class="remote-btn learning-btn" data-button="ceiling_bright_up">
                                        <i class="fa-solid fa-sun"></i>
                                        <span>Bright+</span>
                                    </button>
                                    <button class="remote-btn learning-btn" data-button="ceiling_bright_down">
                                        <i class="fa-solid fa-moon"></i>
                                        <span>Bright-</span>
                                    </button>
                                </div>
                                <div class="button-row">
                                    <button class="remote-btn learning-btn" data-button="ceiling_red">
                                        <i class="fa-solid fa-circle" style="color: #ff4444;"></i>
                                        <span>Red</span>
                                    </button>
                                    <button class="remote-btn learning-btn" data-button="ceiling_green">
                                        <i class="fa-solid fa-circle" style="color: #44ff44;"></i>
                                        <span>Green</span>
                                    </button>
                                    <button class="remote-btn learning-btn" data-button="ceiling_blue">
                                        <i class="fa-solid fa-circle" style="color: #4444ff;"></i>
                                        <span>Blue</span>
                                    </button>
                                </div>
                                <div class="button-row">
                                    <button class="remote-btn learning-btn" data-button="ceiling_white">
                                        <i class="fa-solid fa-circle" style="color: #ffffff;"></i>
                                        <span>White</span>
                                    </button>
                                    <button class="remote-btn learning-btn" data-button="ceiling_mode">
                                        <i class="fa-solid fa-palette"></i>
                                        <span>Mode</span>
                                    </button>
                                    <button class="remote-btn learning-btn" data-button="ceiling_speed">
                                        <i class="fa-solid fa-forward"></i>
                                        <span>Speed</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- LED TV Learning Remote -->
                        <div class="remote-panel learning-panel">
                            <h4 class="remote-title">
                                <i class="fa-solid fa-tv"></i>
                                Oświetlenie LED TV
                            </h4>
                            <div class="remote-buttons">
                                <div class="button-row">
                                    <button class="remote-btn learning-btn" data-button="tv_power">
                                        <i class="fa-solid fa-power-off"></i>
                                        <span>Power</span>
                                    </button>
                                    <button class="remote-btn learning-btn" data-button="tv_bright_up">
                                        <i class="fa-solid fa-sun"></i>
                                        <span>Bright+</span>
                                    </button>
                                    <button class="remote-btn learning-btn" data-button="tv_bright_down">
                                        <i class="fa-solid fa-moon"></i>
                                        <span>Bright-</span>
                                    </button>
                                </div>
                                <div class="button-row">
                                    <button class="remote-btn learning-btn" data-button="tv_red">
                                        <i class="fa-solid fa-circle" style="color: #ff4444;"></i>
                                        <span>Red</span>
                                    </button>
                                    <button class="remote-btn learning-btn" data-button="tv_green">
                                        <i class="fa-solid fa-circle" style="color: #44ff44;"></i>
                                        <span>Green</span>
                                    </button>
                                    <button class="remote-btn learning-btn" data-button="tv_blue">
                                        <i class="fa-solid fa-circle" style="color: #4444ff;"></i>
                                        <span>Blue</span>
                                    </button>
                                </div>
                                <div class="button-row">
                                    <button class="remote-btn learning-btn" data-button="tv_white">
                                        <i class="fa-solid fa-circle" style="color: #ffffff;"></i>
                                        <span>White</span>
                                    </button>
                                    <button class="remote-btn learning-btn" data-button="tv_mode">
                                        <i class="fa-solid fa-palette"></i>
                                        <span>Mode</span>
                                    </button>
                                    <button class="remote-btn learning-btn" data-button="tv_speed">
                                        <i class="fa-solid fa-forward"></i>
                                        <span>Speed</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="config-section">
                    <h3 class="settings-title">
                        <i class="fa-solid fa-database"></i>
                        Zarządzanie Konfiguracją
                    </h3>
                    <div class="config-buttons">
                        <button class="config-btn" id="saveConfigBtn">
                            <i class="fa-solid fa-save"></i>
                            Zapisz kody na ESP
                        </button>
                        <button class="config-btn" id="loadConfigBtn">
                            <i class="fa-solid fa-download"></i>
                            Wczytaj kody z ESP
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
