<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilot - ESP32 Remote Control</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#10B981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Pilot">
</head>
<body>
    <div class="background-effects">
        <div class="glow-circle pos1"></div>
        <div class="glow-circle pos2"></div>
    </div>
    
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1 class="app-title">🎮 Pilot</h1>
            <div class="connection-status" id="connectionStatus">
                <i class="fa-solid fa-wifi" id="connectionIcon"></i>
                <span id="connectionText">Łączenie...</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main" id="appMain">
            <!-- Room Tab Content -->
            <div class="tab-content active" id="roomTab">
                <!-- Ceiling Light Section -->
                <section class="light-section">
                    <h2><i class="fa-solid fa-lightbulb"></i> Oświetlenie Sufitowe</h2>
                    <div class="light-controls">
                        <div class="power-buttons">
                            <button class="power-btn on" onclick="sendIRCode('ceiling_on')">
                                <i class="fa-solid fa-power-off"></i>
                                <span>Włącz</span>
                            </button>
                            <button class="power-btn off" onclick="sendIRCode('ceiling_off')">
                                <i class="fa-solid fa-power-off"></i>
                                <span>Wyłącz</span>
                            </button>
                        </div>
                        <div class="remote-grid">
                            <button class="remote-btn" onclick="sendIRCode('ceiling_on')" data-code="ceiling_on">
                                <span>ON</span>
                            </button>
                            <button class="remote-btn" onclick="sendIRCode('ceiling_off')" data-code="ceiling_off">
                                <span>OFF</span>
                            </button>
                            <button class="remote-btn" onclick="sendIRCode('ceiling_mem')" data-code="ceiling_mem">
                                <span>MEM</span>
                            </button>
                            <button class="remote-btn" onclick="sendIRCode('ceiling_50')" data-code="ceiling_50">
                                <span>50%</span>
                            </button>
                            <button class="remote-btn" onclick="sendIRCode('ceiling_plus')" data-code="ceiling_plus">
                                <span><i class="fa-solid fa-plus"></i></span>
                            </button>
                            <button class="remote-btn" onclick="sendIRCode('ceiling_minus')" data-code="ceiling_minus">
                                <span><i class="fa-solid fa-minus"></i></span>
                            </button>
                            <button class="remote-btn" onclick="sendIRCode('ceiling_cct')" data-code="ceiling_cct">
                                <span>CCT</span>
                            </button>
                            <button class="remote-btn" onclick="sendIRCode('ceiling_night')" data-code="ceiling_night">
                                <span>Night</span>
                            </button>
                        </div>
                    </div>
                </section>

                <!-- Ambilight TV Section -->
                <section class="light-section">
                    <h2><i class="fa-solid fa-tv"></i> Ambilight TV</h2>
                    <div class="light-controls">
                        <div class="power-buttons">
                            <button class="power-btn on" onclick="sendIRCode('tv_on')">
                                <i class="fa-solid fa-power-off"></i>
                                <span>Włącz</span>
                            </button>
                            <button class="power-btn off" onclick="sendIRCode('tv_off')">
                                <i class="fa-solid fa-power-off"></i>
                                <span>Wyłącz</span>
                            </button>
                        </div>
                        <div class="remote-grid">
                            <button class="remote-btn" onclick="sendIRCode('tv_bright_up')" data-code="tv_bright_up">
                                <span><i class="fa-solid fa-plus"></i></span>
                            </button>
                            <button class="remote-btn" onclick="sendIRCode('tv_bright_down')" data-code="tv_bright_down">
                                <span><i class="fa-solid fa-minus"></i></span>
                            </button>
                            <button class="remote-btn" onclick="sendIRCode('tv_play')" data-code="tv_play">
                                <span><i class="fa-solid fa-play"></i></span>
                            </button>
                            <button class="remote-btn" onclick="sendIRCode('tv_pause')" data-code="tv_pause">
                                <span><i class="fa-solid fa-pause"></i></span>
                            </button>
                        </div>
                        <div class="color-palette">
                            <button class="color-btn" style="background: #ff0000;" onclick="sendIRCode('tv_red')" data-code="tv_red"></button>
                            <button class="color-btn" style="background: #00ff00;" onclick="sendIRCode('tv_green')" data-code="tv_green"></button>
                            <button class="color-btn" style="background: #0000ff;" onclick="sendIRCode('tv_blue')" data-code="tv_blue"></button>
                            <button class="color-btn" style="background: #ffff00;" onclick="sendIRCode('tv_yellow')" data-code="tv_yellow"></button>
                            <button class="color-btn" style="background: #ff00ff;" onclick="sendIRCode('tv_magenta')" data-code="tv_magenta"></button>
                            <button class="color-btn" style="background: #00ffff;" onclick="sendIRCode('tv_cyan')" data-code="tv_cyan"></button>
                            <button class="color-btn" style="background: #ffffff;" onclick="sendIRCode('tv_white')" data-code="tv_white"></button>
                            <button class="color-btn" style="background: #ffa500;" onclick="sendIRCode('tv_orange')" data-code="tv_orange"></button>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Learning Tab Content -->
            <div class="tab-content" id="learningTab">
                <div class="learning-content">
                    <h2><i class="fa-solid fa-graduation-cap"></i> Tryb Nauki</h2>
                    <div class="pilot-selector">
                        <button class="pilot-select-btn active" onclick="selectPilot('ceiling')" data-pilot="ceiling">
                            <i class="fa-solid fa-lightbulb"></i>
                            <span>Pilot Sufitowy</span>
                        </button>
                        <button class="pilot-select-btn" onclick="selectPilot('tv')" data-pilot="tv">
                            <i class="fa-solid fa-tv"></i>
                            <span>Pilot TV</span>
                        </button>
                    </div>
                    <div class="learning-instructions">
                        <p>Kliknij przycisk do nauki:</p>
                    </div>
                    <div class="learning-remote" id="learningRemote">
                        <!-- Remote buttons will be populated here -->
                    </div>
                    <div class="learning-status" id="learningStatus" style="display: none;">
                        <div class="progress-ring">
                            <div class="progress-bar-circular" id="learningProgress"></div>
                        </div>
                        <div class="learning-info">
                            <h3>Nauka w toku...</h3>
                            <p id="learningTimer">30s pozostało</p>
                            <p>Naciśnij przycisk na fizycznym pilocie</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings Tab Content -->
            <div class="tab-content" id="settingsTab">
                <div class="settings-content">
                    <h2><i class="fa-solid fa-gear"></i> Ustawienia</h2>
                    <div class="settings-sections">
                        <section class="settings-section">
                            <h3>Połączenie</h3>
                            <div class="setting-item">
                                <label>Status ESP32:</label>
                                <span id="espStatus">Rozłączony</span>
                            </div>
                            <div class="setting-item">
                                <label>ID ESP32:</label>
                                <span>klaj886</span>
                            </div>
                            <button class="setting-btn" onclick="reconnectESP()">
                                <i class="fa-solid fa-arrows-rotate"></i>
                                Ponów połączenie
                            </button>
                        </section>

                        <section class="settings-section">
                            <h3>Zapisane Kody</h3>
                            <div class="codes-table" id="codesTable">
                                <div class="table-placeholder">
                                    <i class="fa-solid fa-spinner fa-spin"></i> Ładowanie...
                                </div>
                            </div>
                            <div class="setting-actions">
                                <button class="setting-btn" onclick="loadCodes()">
                                    <i class="fa-solid fa-download"></i>
                                    Pobierz Kody
                                </button>
                                <button class="setting-btn" onclick="exportConfig()">
                                    <i class="fa-solid fa-file-export"></i>
                                    Eksportuj Konfigurację
                                </button>
                                <button class="setting-btn" onclick="importConfig()">
                                    <i class="fa-solid fa-file-import"></i>
                                    Importuj Konfigurację
                                </button>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="switchTab('room')" data-tab="room">
                <i class="fa-solid fa-house"></i>
                <span>Pokój</span>
            </button>
            <button class="nav-btn" onclick="switchTab('learning')" data-tab="learning">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Nauka</span>
            </button>
            <button class="nav-btn" onclick="switchTab('settings')" data-tab="settings">
                <i class="fa-solid fa-gear"></i>
                <span>Ustawienia</span>
            </button>
        </nav>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
