<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  
  <!-- Remote control body -->
  <rect x="50" y="30" width="100" height="140" rx="20" fill="url(#primary)" opacity="0.8"/>
  
  <!-- Remote buttons -->
  <circle cx="75" cy="60" r="8" fill="#F8FAFC" opacity="0.9"/>
  <circle cx="125" cy="60" r="8" fill="#F8FAFC" opacity="0.9"/>
  <circle cx="75" cy="90" r="8" fill="#F8FAFC" opacity="0.9"/>
  <circle cx="125" cy="90" r="8" fill="#F8FAFC" opacity="0.9"/>
  <circle cx="75" cy="120" r="8" fill="#F8FAFC" opacity="0.9"/>
  <circle cx="125" cy="120" r="8" fill="#F8FAFC" opacity="0.9"/>
  
  <!-- Central control -->
  <circle cx="100" cy="150" r="12" fill="#F8FAFC" opacity="0.9"/>
  
  <!-- Signal waves -->
  <path d="M 100 180 Q 120 190 100 200 Q 80 190 100 180" fill="none" stroke="#10B981" stroke-width="3" opacity="0.6"/>
  <path d="M 100 175 Q 130 185 100 200 Q 70 185 100 175" fill="none" stroke="#10B981" stroke-width="2" opacity="0.4"/>
  
</svg>
